[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tongji-yunpan-cli"
version = "0.1.0"
description = "Unofficial CLI for Tongji Yunpan (AnyShare): upload, download, and share links"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "WALKERKILLER", email = "walker_killer@163.com" },
]
keywords = ["tongji", "yunpan", "anyshare", "cli", "cloud-drive"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28",
    "pycryptodome>=3.18",
]

[project.scripts]
typan = "tongjiyunpan.cli:main"

[project.urls]
Repository = "https://github.com/WALKERKILLER/tongji-yunpan-cli"
Issues = "https://github.com/WALKERKILLER/tongji-yunpan-cli/issues"

[tool.setuptools.packages.find]
include = ["tongjiyunpan*"]
